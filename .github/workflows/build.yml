name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key (first build only)
        run: |
          if [ ! -f keystore/fixkeyboard.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/fixkeyboard.jks -storepass fixkeyboard -keypass fixkeyboard -alias fixkeyboard -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fix Keyboard"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/fixkeyboard.jks
            git commit -m "Add signing key [skip ci]"
            git push
          fi

      - name: Build the app
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FixKeyboard.apk

      - name: Publish download link (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fix Keyboard (build ${{ github.run_number }})
          make_latest: true
          files: FixKeyboard.apk
